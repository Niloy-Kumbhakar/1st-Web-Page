<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>N_Lab Science Interactive Hub</title>
  <link rel="stylesheet" href="Style.css">
</head>
<body class="dark-mode">

  <!-- Top-Left Mode Switcher Button -->
  <button id="theme-toggle" class="theme-btn" aria-label="Toggle theme">☀️ Light Mode</button>

  <!-- Full-Screen Central Main Panel -->
  <main class="main-panel">
    <div class="content-box">
      <h1>N_Lab Science Interactive Hub</h1>
      <p>Select a tool to launch in a new tab:</p>
      
      <!-- Action Buttons -->
      <div class="button-group">
        <button id="btn-ptable" class="chemistry-buttons">Periodic Table</button>
        <button id="btn-orbitals" class="chemistry-buttons">3D Orbitals</button>
      </div>
      <div class="button-group physics-button-group">
        <button id="btn-optics" class="physics-buttons">Optics</button>
      </div>
    </div>
  </main>

  <script src="Script.js"></script>
</body>
</html>
